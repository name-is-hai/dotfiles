set-option -sa terminal-overrides ",xterm*:Tc,ghostty*:Tc"
set -g mouse on
set -g status-position bottom
# set -s extended-keys on
set -as terminal-features 'xterm*:extkeys'
set -as terminal-features 'ghostty*:extkeys'
set -g allow-passthrough on
# set -s set-clipboard on
set-window-option -g xterm-keys on

unbind C-b
set -g prefix C-Space
bind C-Space send-prefix

# Vim style pane selection
bind h select-pane -L
bind j select-pane -D 
bind k select-pane -U
bind l select-pane -R

# Start windows and panes at 1, not 0
set -g base-index 1
set -g pane-base-index 1
set-window-option -g pane-base-index 1
set-option -g renumber-windows on

# Shift arrow to switch windows
bind -n S-Left  previous-window
bind -n S-Right next-window

# Shift Alt vim keys to switch windows
bind -n M-H previous-window
bind -n M-L next-window

# set -g @catppuccin_flavour 'mocha'
# set -g @plugin 'dreamsofcode-io/catppuccin-tmux'

set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-sensible'
set -g @plugin 'christoomey/vim-tmux-navigator'
set -g @plugin 'tmux-plugins/tmux-yank'

run '~/.config/tmux/plugins/tpm/tpm'

# set vi-mode
set-window-option -g mode-keys vi
# keybindings
bind-key -T copy-mode-vi v send-keys -X begin-selection
bind-key -T copy-mode-vi C-v send-keys -X rectangle-toggle
bind-key -T copy-mode-vi y send-keys -X copy-selection-and-cancel

bind '"' split-window -v -c "#{pane_current_path}"
bind % split-window -h -c "#{pane_current_path}"

bind r source-file ~/.config/tmux/tmux.conf \; display-message "Tmux config reloaded!"

set -gu status-bg
set -gu status-fg
set -gu window-status-activity-style

# Status layout: transparent/blended background matching terminal
set -g status-style "fg=#e2e0df,bg=default"
set -g status-position bottom
set -g status-justify absolute-centre

# Left
set -g status-left ""
set -g status-left-length 50

# Right: session 
set -g status-right "   #[fg=#e2e0df,bold]#S "
set -g status-right-length 50

# Windows
set -g window-status-style default
set -g window-status-current-style default
set -g window-status-separator "  #[fg=#454240]•#[default]  "
set -g window-status-format "#[fg=#85807a][#I] #W"
set -g window-status-current-format "#[fg=#e2e0df,bold][#I] #W"

# Pane borders
set -g pane-border-style "fg=#454240"
set -g pane-active-border-style "fg=#eaa4c9"

# Messages and command prompt
set -g message-style "fg=#171616,bg=#dfd286"
set -g message-command-style "fg=#171616,bg=#96d8e3"

# Selection & mode
set -g mode-style "fg=#171616,bg=#353331"
set -g copy-mode-match-style "fg=#171616,bg=#dfd286"
set -g copy-mode-current-match-style "fg=#171616,bg=#e3b096"

# panes
set -g display-panes-colour "#454240"
set -g display-panes-active-colour "#eaa4c9"

